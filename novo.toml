[package]
name        = "ms5611-nv"
version     = "0.1.1"
description = "A driver for TE Connectivity's MS5611-01BA03 barometric pressure sensor on an I2C or an SPI bus: the reset, the PROM and its CRC-4 check, the pressure and temperature conversions at the five oversampling ratios with their conversion times, and the data sheet's first and second order compensation in integers, as devices-nv's Barometer and Thermometer."
license     = "Apache-2.0"
stability   = "experimental"
category    = "embedded"
layer       = "host"
tags        = ["ms5611", "ms5607", "barometer", "pressure", "thermometer", "altimeter", "i2c", "spi", "sensor", "nrf52840-dk", "nrf54lm20-dk"]
repository  = "https://github.com/novolang/ms5611-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.24.0"

# Every module of the package checks at the embedded tier, so a program
# of any tier, embedded, rt or system, may call it.
[tier]
tier = "embedded"

# The device program, examples/baro_read.nv, has no [[bin]] entry: an
# entry makes the registry list the package as a program, and a library
# with an entry would be built by `novo install` for the host.
# tests/device_build.sh builds the program for two boards as the main of
# a scratch package that depends on this one.

[docs.pages]
"README.md" = "Reading an MS5611 barometer from a device program"

[dependencies]
# The board's I2C bus, SPI bus, GPIO and timer handles, and the I2cBus,
# SpiBus, GpioOut and Timer traits they implement.
embedded-hal-nv = "^0.4.0"
# The wiring record a board's device table hands `attach`, the register
# helpers, and the Barometer and Thermometer traits.  Both are registry
# ranges: a path dependency here would make devices-nv's own range a second
# package.
devices-nv      = "^0.4.0"
